model_list:
  - model_name: knn-placeholder-nvidia
    litellm_params:
      model: openai/placeholder
      api_base: os.environ/NVIDIA_NIM_BASE_URL
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: knn-placeholder-experiential
    litellm_params:
      model: openai/placeholder
      api_base: os.environ/EXPERIENTIAL_BASE_URL
      api_key: os.environ/EXPERIENTIAL_API_KEY
  - model_name: knn-placeholder-kie
    litellm_params:
      model: openai/placeholder
      api_base: os.environ/KIE_BASE_URL
      api_key: os.environ/KIE_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
